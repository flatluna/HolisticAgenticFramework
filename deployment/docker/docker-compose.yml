version: '3.8'

services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "YourStrong@Password123"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql

  api:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.api
    ports:
      - "5000:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sql;Database=AETP_Dev;User Sa;Password=YourStrong@Password123;
    depends_on:
      - sql

  web:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.web
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  sqldata:
